name: emscripten-macos-x86

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-emscripten-macos-x86:
    name: Emscripten (macOS x86_64)
    runs-on: macos-15-intel

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install package
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Download Emscripten toolchain
      run: uv run clang-tool-chain-emcc --version
      timeout-minutes: 20

    - name: Verify Emscripten installation
      run: |
        echo "Testing basic Emscripten compilation..."
        cat > test_wasm.cpp << 'EOF'
        #include <iostream>
        int main() {
            std::cout << "Hello WebAssembly!" << std::endl;
            return 0;
        }
        EOF
        uv run clang-tool-chain-empp test_wasm.cpp -o test_wasm.js
        node test_wasm.js

    - name: Run Emscripten basic tests
      run: uv run pytest tests/test_emscripten.py -v

    - name: Run Emscripten full pipeline tests
      run: uv run pytest tests/test_emscripten_full_pipeline.py -v

    - name: Run LLVM version consistency tests
      run: uv run pytest tests/test_version_consistency.py -v
