name: emscripten-sccache-linux-arm

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-emscripten-sccache-linux-arm:
    name: Emscripten + sccache (Linux ARM64)
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install package with sccache support
      run: |
        uv venv
        uv pip install -e ".[dev,sccache]"

    - name: Display platform information
      run: |
        echo "Platform: Linux ARM64 with Emscripten and sccache"
        uname -a
        python --version

    - name: Download Emscripten toolchain
      run: uv run clang-tool-chain-emcc --version
      timeout-minutes: 20

    - name: Verify sccache installation
      run: |
        uv run clang-tool-chain-sccache --version
        uv run clang-tool-chain-sccache --show-stats

    - name: Test Emscripten compilation with sccache
      run: |
        cat > test_em_sccache.cpp << 'EOF'
        #include <iostream>
        int main() {
            std::cout << "Hello WebAssembly from Linux ARM64 with sccache!" << std::endl;
            return 0;
        }
        EOF
        uv run clang-tool-chain-empp test_em_sccache.cpp -o test_em_sccache.js
        node test_em_sccache.js

    - name: Check sccache statistics
      run: uv run clang-tool-chain-sccache --show-stats

    - name: Run Emscripten basic tests
      run: uv run pytest tests/test_emscripten.py -v

    - name: Run Emscripten full pipeline tests
      run: uv run pytest tests/test_emscripten_full_pipeline.py -v

    - name: Run LLVM version consistency tests
      run: uv run pytest tests/test_version_consistency.py -v
